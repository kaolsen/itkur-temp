# LT_-målerne annoncerer HID-servicen 0x1812. BlueZ' input/hog-plugin behandler
# dem derfor som tastatur/mus: markerer dem Trusted, auto-forbinder og holder
# forbindelsen (dræner batteriet, og listen.py kan ikke forbinde).
# Pi'en bruger ingen Bluetooth-tastaturer, så pluginnerne slås fra.
# Installeres i /etc/systemd/system/bluetooth.service.d/
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=input,hog
